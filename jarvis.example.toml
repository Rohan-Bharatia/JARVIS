# JARVIS example configuration.
# Copy to ~/.config/jarvis/jarvis.toml and adjust.

[llm]
model = "qwen2.5:7b"
endpoint = "http://127.0.0.1:11434"
num_ctx = 8192
temperature = 0.0

[agent]
plan_review = true
loop_cap = 20
default_timeout = 60

# Tool policy. Empty `allow` means every registered tool is permitted unless
# denied; approval is still required for tools marked requires_approval or
# side_effects while plan_review is on.
[tools]
allow = []
deny = []
# Optional extra directory of declarative *.tool.md tool definitions that are
# merged over the bundled defaults.
tools_dir = "~/.config/jarvis/tools"

# MCP servers must use the stdio transport and local commands only (offline).
[mcp.servers.files]
command = "jarvis-mcp-files"

[mcp.servers.shell]
command = "/nix/store/00000000000000000000000000000000-mcp-shell/bin/mcp-shell"
args = ["--workspace", "~/JARVIS-workspace"]
env = ["HOME", "USER"]
