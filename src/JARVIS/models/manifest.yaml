# Declared offline, free (no API keys) local models.
#
# ollama_tag: tag to look up in the local Ollama instance.
# local_path: optional path to a GGUF file instead of an Ollama-managed model.
# sha256:    optional checksum; `jarvis doctor --deep` verifies it when set.
# guardrails: "none" means the model has no built-in refusal/guardrail alignment;
#             JARVIS's safety lives entirely in the runtime, not the model.
models:
  qwen2.5:7b:
    ollama_tag: "qwen2.5:7b"
    license: "Apache-2.0"
    guardrails: "none"
    local_path: null
    sha256: null
  qwen2.5:3b:
    ollama_tag: "qwen2.5:3b"
    license: "Apache-2.0"
    guardrails: "none"
    local_path: null
    sha256: null
  qwen2.5:14b:
    ollama_tag: "qwen2.5:14b"
    license: "Apache-2.0"
    guardrails: "none"
    local_path: null
    sha256: null
  llama3.1:8b:
    ollama_tag: "llama3.1:8b"
    license: "Llama-3.1-Community"
    guardrails: "none"
    local_path: null
    sha256: null
